name: Test approved week (publish gate)

# CI gate for an approved drafts/wNN branch.
#
# This workflow only TESTS the draft branch. It must not merge to main: the
# `main` ruleset requires changes to arrive through a pull request, so a direct
# push from Actions is always rejected with
#   remote: error: GH013: Repository rule violations found for refs/heads/main.
#   remote: - Changes must be made through a pull request.
#
# The merge is done over the pull-request API by
# hermes/tools/trigger_publish.py, which runs on the ops host with GITHUB_PAT
# and acts only after this run reports success.
# See hermes/skills/publish-gate/SKILL.md.

on:
  workflow_dispatch:
    inputs:
      draft_branch:
        description: "Draft branch (e.g. drafts/w01)"
        required: true
        type: string
      week:
        description: "Week id (e.g. w01)"
        required: true
        type: string
      pattern_dir:
        description: "Pattern folder under patterns/ (e.g. w01-augmented-llm)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-gate
  cancel-in-progress: false

jobs:
  test-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch draft branch
        run: git fetch origin "${{ inputs.draft_branch }}"

      - uses: astral-sh/setup-uv@v5

      - name: Test pattern code on draft
        run: |
          git checkout "origin/${{ inputs.draft_branch }}"
          cd "patterns/${{ inputs.pattern_dir }}/code"
          uv sync --extra dev
          uv run pytest
