name: Test pattern code

on:
  push:
    branches: [main, "drafts/**"]
  pull_request:
    branches: [main]

jobs:
  pytest-w01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test w01 sample
        working-directory: patterns/w01-augmented-llm/code
        run: |
          uv sync --extra dev
          uv run pytest
